name: riverpod_go_router_boilerplate
description: "Opinionated production-ready Flutter boilerplate using Riverpod and GoRouter."
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─────────────────────────────────────────────────────────────────────────────
  # STATE MANAGEMENT & ARCHITECTURE
  # ─────────────────────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^3.4.3

  # ─────────────────────────────────────────────────────────────────────────────
  # NAVIGATION
  # ─────────────────────────────────────────────────────────────────────────────
  go_router: ^18.0.2

  # ─────────────────────────────────────────────────────────────────────────────
  # NETWORKING & API
  # ─────────────────────────────────────────────────────────────────────────────
  dio: ^5.11.1
  native_dio_adapter: ^1.8.0 # Uses Cronet (Android) / NSURLSession (iOS) for HTTP/3 & Brotli
  connectivity_plus: ^7.0.0
  retry: ^3.1.2

  # ─────────────────────────────────────────────────────────────────────────────
  # SERIALIZATION & MODELS
  # ─────────────────────────────────────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # ─────────────────────────────────────────────────────────────────────────────
  # STORAGE & SECURITY
  # ─────────────────────────────────────────────────────────────────────────────
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6

  # ─────────────────────────────────────────────────────────────────────────────
  # DATABASE & OFFLINE CACHING (Drift - SQLite)
  # ─────────────────────────────────────────────────────────────────────────────
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.5.42

  # ─────────────────────────────────────────────────────────────────────────────
  # BIOMETRIC AUTHENTICATION
  # ─────────────────────────────────────────────────────────────────────────────
  local_auth: ^3.0.2

  # ─────────────────────────────────────────────────────────────────────────────
  # FIREBASE SUITE (Crashlytics, Analytics, Performance, Remote Config)
  # ─────────────────────────────────────────────────────────────────────────────
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  firebase_analytics: ^12.6.0
  firebase_performance: ^0.11.6
  firebase_remote_config: ^6.7.0

  # ─────────────────────────────────────────────────────────────────────────────
  # DEEP LINKING
  # ─────────────────────────────────────────────────────────────────────────────
  app_links: ^7.2.2

  # ─────────────────────────────────────────────────────────────────────────────
  # PERMISSIONS
  # ─────────────────────────────────────────────────────────────────────────────
  permission_handler: ^12.0.3

  # ─────────────────────────────────────────────────────────────────────────────
  # IN-APP REVIEW
  # ─────────────────────────────────────────────────────────────────────────────
  in_app_review: ^2.0.12

  # ─────────────────────────────────────────────────────────────────────────────
  # NOTIFICATIONS
  # ─────────────────────────────────────────────────────────────────────────────
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1 # Required for scheduled notifications
  # Note: App icon badges are handled via:
  # - iOS: APNS payload from server (badge field in push notification)
  # - Android: Notification dots (automatic with Android 8.0+)
  # - In-app: BadgeCount Riverpod provider for UI badges (inbox icon, etc.)
  # Firebase Messaging - optional, requires Firebase setup
  # Uncomment after adding google-services.json / GoogleService-Info.plist
  # firebase_messaging: ^15.0.0

  # ─────────────────────────────────────────────────────────────────────────────
  # FORMS (Model-Driven Form Management)
  # ─────────────────────────────────────────────────────────────────────────────
  reactive_forms: ^18.2.2

  # ─────────────────────────────────────────────────────────────────────────────
  # UI & UX
  # ─────────────────────────────────────────────────────────────────────────────
  cupertino_icons: ^1.0.9
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  gap: ^3.0.1
  flutter_animate: ^4.5.2
  lottie: ^3.6.1

  # ─────────────────────────────────────────────────────────────────────────────
  # UTILITIES
  # ─────────────────────────────────────────────────────────────────────────────
  logger: ^2.8.0
  uuid: ^4.6.0
  intl: ^0.20.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6

  path: any # Required by drift; version is constrained by drift itself

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ─────────────────────────────────────────────────────────────────────────────
  # LINTING & ANALYSIS
  # ─────────────────────────────────────────────────────────────────────────────
  very_good_analysis: ^11.0.0

  # ─────────────────────────────────────────────────────────────────────────────
  # CODE GENERATION
  # ─────────────────────────────────────────────────────────────────────────────
  build_runner: ^2.16.2
  riverpod_generator: ^4.0.9
  drift_dev: ^2.35.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1

  # ─────────────────────────────────────────────────────────────────────────────
  # TESTING
  # ─────────────────────────────────────────────────────────────────────────────
  mocktail: ^1.0.5

  # ─────────────────────────────────────────────────────────────────────────────
  # TOOLING
  # ─────────────────────────────────────────────────────────────────────────────
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/app_logo.png

  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    image: assets/images/app_logo.png

# ─────────────────────────────────────────────────────────────────────────────
# App Icons Configuration (flutter_launcher_icons)
# ─────────────────────────────────────────────────────────────────────────────
# Run: dart run flutter_launcher_icons
# Documentation: https://pub.dev/packages/flutter_launcher_icons
# ─────────────────────────────────────────────────────────────────────────────
flutter_launcher_icons:
  # Path to the base icon image (1024x1024 recommended)
  image_path: "assets/images/app_logo.png"

  # Android configuration
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_logo.png"
  min_sdk_android: 23

  # iOS configuration
  ios: true
  remove_alpha_ios: true

  # Web configuration (optional)
  web:
    generate: false

  # Windows configuration (optional)
  windows:
    generate: false

  # macOS configuration (optional)
  macos:
    generate: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
# The following section is specific to Flutter packages.
flutter:
  # Enable code generation for localization
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/animations/
